<head>
<meta charset="UTF-8">

<title>Гримуар</title>
<script>/* тема приложения (grimuar.theme) — чтобы пустой экран до расшифровки был в его цветах */
(function(){var t='dark';try{t=localStorage.getItem('grimuar.theme')||'dark';}catch(e){}
var l=t==='light'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches);
if(l){document.documentElement.className='lt';document.querySelector('meta[name="theme-color"]').setAttribute('content','#e9dfc8');}})();</script>
<style>
:root{--bg:#131009;--panel:#1c1710;--line:#392e1d;--well:#0e0b06;--inp:#59462a;--text:#eadfc6;--muted:#a4906e;--brass:#c9a35c;--err:#eb7a5e;color-scheme:dark}
:root.lt{--bg:#e9dfc8;--panel:#f6efdd;--line:#d6c7a5;--well:#ebe1ca;--inp:#b9a278;--text:#2a2014;--muted:#65522f;--brass:#7f5a17;--err:#b13c27;color-scheme:light}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
form{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;box-sizing:border-box}
h1{margin:0 0 14px;font-size:22px;font-weight:600;color:var(--brass);text-align:center;letter-spacing:.04em}
input[type=password]{width:100%;box-sizing:border-box;font-size:17px;padding:12px;border-radius:8px;border:1px solid var(--inp);background:var(--well);color:var(--text)}
label{display:flex;gap:8px;align-items:center;margin:12px 0;color:var(--muted);font-size:15px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--brass)}
button{width:100%;font-size:17px;padding:12px;border:0;border-radius:8px;background:var(--brass);color:var(--bg);font-weight:600}
button:disabled{opacity:.6}
.e{color:var(--err);min-height:1.4em;margin-top:10px;font-size:15px;text-align:center}
/* загрузка: пустой экран; кольцо проявляется, только если расшифровка дольше ~0,6 с */
.ld{position:fixed;left:50%;top:50%;width:28px;height:28px;margin:-14px;border:3px solid var(--line);border-top-color:var(--brass);border-radius:50%;opacity:0;animation:sp .9s linear infinite,ap .3s .6s forwards}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes ap{to{opacity:1}}
</style>
</head>
<body>
<div class="ld" id="ld"></div>
<div class="w" id="w" hidden>
<form id="f" autocomplete="on">
<h1>Гримуар</h1>
<input type="text" name="username" value="grimoire" autocomplete="username" hidden>
<input type="password" id="p" placeholder="Пароль" autocomplete="current-password" required>
<label><input type="checkbox" id="r" checked> Запомнить на этом устройстве</label>
<button id="b">Открыть</button>
<div class="e" id="e"></div>
</form>
</div>

function hex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
function tohex(a){return Array.prototype.map.call(a,function(x){return('0'+x.toString(16)).slice(-2);}).join('');}
function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
var $=function(id){return document.getElementById(id);};
async function derive(pw){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:hex(SALT),iterations:ITER},k,256));
}
async function decrypt(raw){
  var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  var buf=b64(DATA);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
  return await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
function show(html){document.open();document.write(html);document.close();}
function form(msg){$('ld').hidden=true;$('w').hidden=false;if(msg)$('e').textContent=msg;$('p').focus();}
if(!window.crypto||!crypto.subtle||!window.DecompressionStream){form('Этот браузер слишком старый для открытия Гримуара.');return;}
var saved=null;try{saved=JSON.parse(localStorage.getItem(LS)||'null');}catch(e){}
if(saved&&saved.salt===SALT&&saved.key){decrypt(hex(saved.key)).then(show,function(){try{localStorage.removeItem(LS);}catch(e){}form();});}
else form();
$('f').addEventListener('submit',async function(ev){
  ev.preventDefault();$('b').disabled=true;$('e').textContent='';
  try{
    var raw=await derive($('p').value);
    var html;try{html=await decrypt(raw);}catch(e){$('b').disabled=false;$('e').textContent='Неверный пароль';return;}
    if($('r').checked){try{localStorage.setItem(LS,JSON.stringify({salt:SALT,key:tohex(raw)}));}catch(e){}}
    show(html);
  }catch(e){$('b').disabled=false;$('e').textContent='Ошибка: '+e.message;}
});
})();
